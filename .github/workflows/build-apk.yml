name: CHRONOS V4 validation

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronos-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, lint, debug and release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6

      - name: Clean build, regression tests and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean :androidApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Release APK and AAB (unsigned unless signing secrets are configured)
        shell: bash
        env:
          CHRONOS_KEYSTORE_BASE64: ${{ secrets.CHRONOS_KEYSTORE_BASE64 }}
          CHRONOS_KEYSTORE_PASSWORD: ${{ secrets.CHRONOS_KEYSTORE_PASSWORD }}
          CHRONOS_KEY_ALIAS: ${{ secrets.CHRONOS_KEY_ALIAS }}
          CHRONOS_KEY_PASSWORD: ${{ secrets.CHRONOS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [[ -n "$CHRONOS_KEYSTORE_BASE64" ]]; then
            printf '%s' "$CHRONOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chronos-release.jks"
            export CHRONOS_KEYSTORE_PATH="$RUNNER_TEMP/chronos-release.jks"
          fi
          ./gradlew --no-daemon :androidApp:assembleRelease :androidApp:bundleRelease --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          rm -f "$RUNNER_TEMP/chronos-release.jks"

      - name: Validate APK and bundle signatures/manifest
        run: |
          set -euo pipefail
          debug=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          release="$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          test -s "$debug" && test -s "$aab"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$debug"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$debug" | head -12
          unzip -t "$aab" >/dev/null
          if [[ -f "$release" ]]; then
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$release" | head -12
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$release" || echo 'Release APK is unsigned; signing is required before distribution.'
          fi
          mkdir -p artifacts
          cp "$debug" "artifacts/CHRONOS-v4-${GITHUB_SHA::7}-debug.apk"
          cp "$aab" "artifacts/CHRONOS-v4-${GITHUB_SHA::7}-release.aab"
          if [[ -f "$release" ]]; then
            if "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$release" >/dev/null 2>&1; then
              cp "$release" "artifacts/CHRONOS-v4-${GITHUB_SHA::7}-release-signed.apk"
            else
              cp "$release" "artifacts/CHRONOS-v4-${GITHUB_SHA::7}-release-unsigned.apk"
            fi
          else
            echo '::error::Release APK missing'
            exit 1
          fi
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt

      - name: Publish verification evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, glob, hashlib, json, os, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('androidApp/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals: totals[key] += int(root.attrib.get(key, 0))
          artifacts = []
          for path in glob.glob('artifacts/*'):
              if os.path.isfile(path): artifacts.append(dict(file=path, bytes=os.path.getsize(path), sha256=hashlib.sha256(open(path,'rb').read()).hexdigest()))
          evidence = dict(unit_tests=totals, artifacts=artifacts)
          print(json.dumps(evidence, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out: out.write('## V4 verification\n```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          print('::notice title=Verification evidence (base64)::' + base64.b64encode(json.dumps(evidence).encode()).decode())
          lint = 'androidApp/build/reports/lint-results-debug.xml'
          if os.path.exists(lint):
              issues = ET.parse(lint).getroot().findall('issue')
              summary = [dict(id=i.attrib.get('id'), severity=i.attrib.get('severity'), message=i.attrib.get('message')) for i in issues]
              print('::notice title=Lint findings (base64)::' + base64.b64encode(json.dumps(summary).encode()).decode())
          PY

      - name: Surface concise Gradle failure details
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/gradle.log" ]]; then
            diagnostics="$(grep -nE '(^e: |error:|^FAILURE:|What went wrong:|^> Task .*FAILED|^Execution failed|^BUILD FAILED|FAILED$)' "$RUNNER_TEMP/gradle.log" | tail -n 40 || true)"
            echo "::error title=Gradle failure details (base64)::$(printf '%s' "$diagnostics" | base64 -w0)"
            tail -n 60 "$RUNNER_TEMP/gradle.log"
            lint_xml="$(sed -n '/Lint found/,/BUILD FAILED/p' "$RUNNER_TEMP/gradle.log" | head -n 80 || true)"
            if [[ -n "$lint_xml" ]]; then echo "::error title=Lint details (base64)::$(printf '%s' "$lint_xml" | base64 -w0)"; fi
            failure_xml="$(grep -Rh -A 8 '<failure' androidApp/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -n 300 || true)"
            if [[ -n "$failure_xml" ]]; then echo "::error title=Unit test failures (base64)::$(printf '%s' "$failure_xml" | base64 -w0)"; fi
          fi
      - name: Upload V4 artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CHRONOS-V4-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CHRONOS-V4-reports-${{ github.sha }}
          path: |
            androidApp/build/reports/tests/**
            androidApp/build/test-results/**
            androidApp/build/reports/lint-results-*
            androidApp/schemas/**
          if-no-files-found: warn
          retention-days: 30
