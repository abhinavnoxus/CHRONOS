name: Build CHRONOS V3 APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :androidApp:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :androidApp:assembleDebug --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: Surface Gradle failure details
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/gradle.log" ]]; then
            diagnostics="$({
              echo 'Gradle error lines:'
              grep -nE '(^e: |error:|^FAILURE:|What went wrong:|^> Task .*FAILED|^Execution failed|^BUILD FAILED)' "$RUNNER_TEMP/gradle.log" | tail -n 30 || true
              echo 'Final Gradle output:'
              tail -n 30 "$RUNNER_TEMP/gradle.log"
            } 2>&1)"
            encoded_log="$(printf '%s' "$diagnostics" | base64 -w0)"
            echo "::error title=Gradle failure details (base64)::$encoded_log"
          fi

      - name: Give APK a clear download name
        run: |
          apk_path="$(find . -type f -iname '*.apk' -print -quit || true)"
          if [[ -z "$apk_path" ]]; then
            echo "::error title=APK missing::Gradle reported success but no APK was produced."
            exit 1
          fi
          cp "$apk_path" "CHRONOS-v${GITHUB_SHA::7}-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: CHRONOS-V3-APK
          path: CHRONOS-*-debug.apk
          if-no-files-found: error
          retention-days: 90
