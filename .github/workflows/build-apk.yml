name: Build CHRONOS V3 APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Build APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      - name: Surface Gradle failure details
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/gradle.log" ]]; then
            encoded_log="$(tail -n 60 "$RUNNER_TEMP/gradle.log" | base64 -w0)"
            echo "::error title=Gradle failure tail (base64)::$encoded_log"
          fi

      - name: Give APK a clear download name
        run: |
          apk_path="$(find . -type f -iname '*.apk' -print -quit || true)"
          if [[ -z "$apk_path" ]]; then
            diagnostics="$({
              printf 'PWD=%s\nGITHUB_WORKSPACE=%s\n' "$PWD" "$GITHUB_WORKSPACE"
              printf 'Output directories:\n'
              find . -maxdepth 10 -type d \( -name outputs -o -name apk \) -print || true
              printf 'APK/AAB files:\n'
              find . -maxdepth 12 -type f \( -iname '*.apk' -o -iname '*.aab' \) -print || true
            } 2>&1)"
            encoded_diagnostics="$(printf '%s' "$diagnostics" | base64 -w0)"
            echo "::error title=APK missing diagnostics (base64)::$encoded_diagnostics"
            exit 1
          fi
          cp "$apk_path" "CHRONOS-v${GITHUB_SHA::7}-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: CHRONOS-V3-APK
          path: CHRONOS-*-debug.apk
          if-no-files-found: error
          retention-days: 90
