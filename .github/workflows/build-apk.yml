name: Build CHRONOS V3 APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Give APK a clear download name
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "CHRONOS-v${GITHUB_SHA::7}-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: CHRONOS-V3-APK
          path: CHRONOS-*-debug.apk
          if-no-files-found: error
          retention-days: 90
