name: CHRONOS V4 device tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: temurin }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose/Hilt navigation tests on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew --no-daemon :androidApp:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CHRONOS-V4-instrumentation-reports
          path: androidApp/build/reports/androidTests/**
          if-no-files-found: warn
