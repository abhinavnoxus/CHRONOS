name: CHRONOS V4 device tests
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: temurin }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose/Hilt navigation tests on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/run-device-tests.sh
      - name: Surface device-test diagnostics
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/device-gradle.log" ]]; then
            details="$(grep -nE -A 15 '(^e: |error:|FAILED|FAILURES!!!|Tests run:|Exception|What went wrong|Execution failed)' "$RUNNER_TEMP/device-gradle.log" | tail -n 80 || true)"
            echo "::error title=Device test failure (base64)::$(printf '%s' "$details" | base64 -w0)"
          fi
          failures="$(find androidApp/build/outputs/androidTest-results -name '*.xml' -exec grep -H -A 20 '<failure' {} + 2>/dev/null | head -n 150 || true)"
          if [[ -n "$failures" ]]; then echo "::error title=Device test assertions (base64)::$(printf '%s' "$failures" | base64 -w0)"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CHRONOS-V4-instrumentation-reports
          path: |
            androidApp/build/reports/androidTests/**
            androidApp/build/outputs/androidTest-results/**
            ${{ runner.temp }}/device-gradle.log
            ${{ runner.temp }}/device-logcat.txt
          if-no-files-found: warn
